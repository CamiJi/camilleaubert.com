name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh GitHub activity snapshot
        run: node scripts/refresh-github-snapshot.mjs

      - name: Install Satoshi font (OG image generation)
        run: |
          mkdir -p ~/.fonts
          cp src/assets/fonts/Satoshi-Variable.ttf ~/.fonts/
          fc-cache -f

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.39.194.192 >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host camille-prod
            HostName 13.39.194.192
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Sync application files
        run: |
          rsync -az --delete ./src/ camille-prod:/home/ubuntu/apps/portfolio/src/
          rsync -az --delete ./public/ camille-prod:/home/ubuntu/apps/portfolio/public/
          rsync -az ./package.json ./package-lock.json ./astro.config.mjs ./Dockerfile ./nginx.conf camille-prod:/home/ubuntu/apps/portfolio/

      - name: Rebuild and restart container
        run: ssh camille-prod "cd /home/ubuntu/apps/portfolio && docker compose up -d --build"

      - name: Verify deployment
        run: |
          sleep 3
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://camilleaubert.com/)
          echo "HTTP status: $status"
          [ "$status" = "200" ] || exit 1
