# Production nginx config for the camilleaubert.com static site.
# Replaces the default nginx:alpine server (see Dockerfile).
# Goals: correct HTTP caching, baseline security headers, gzip, pretty 404.

server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the Astro 404 page for unknown routes (keeps the 404 status)
    error_page 404 /404.html;

    # --- Baseline security headers (site is 100% static) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Honored by browsers on the HTTPS responses passing through the reverse proxy
    add_header Strict-Transport-Security "max-age=15552000" always;

    # --- Compression (137 KB homepage HTML -> ~20 KB on the wire) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/woff2;

    # --- Hashed build assets: fingerprinted by Astro, safe to cache forever ---
    # NOTE: nginx does not inherit add_header across levels — security headers
    # are repeated in every location block on purpose.
    location /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Versioned static assets: short cache so renames bust it instantly ---
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf|xml|txt)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # --- HTML pages: always revalidate, never serve stale content ---
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
